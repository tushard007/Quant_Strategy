# Activate alongside prod: SPRING_PROFILES_ACTIVE=prod,price-import
spring.main.web-application-type=none
price-data.import.run=true
price-data.import.time-frame=DAILY
price-data.import.chunk-size=25
price-data.import.request-delay-ms=300
scheduling.enabled=false
stock-price.startup-update.enabled=false
market-breadth.schedule.enabled=false
spring.jpa.open-in-view=false
