spring.application.name=Quant_Strategy
server.port=${PORT:8080}
server.forward-headers-strategy=framework
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=alpha

spring.profiles.active=dev
# Server Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
stock-price.startup-update.enabled=false
market-breadth.schedule.enabled=true
# Ordered breadth calculation runs after the existing 16:00 ETF and 17:00 stock update jobs.
market-breadth.eod.cron=0 30 18 * * MON-FRI
price-data.etf.cron=0 0 16 * * MON-FRI
price-data.stock.cron=0 0 17 * * MON-FRI
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#Logging
spring.main.log-startup-info=false
logging.level.root=info
logging.level.org.springframework.web=info
logging.level.org.hibernate=error
logging.file.name=Quant_Strategy.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n

# Optional first-Superadmin bootstrap. Accounts and the JWT signing key are persisted in the database.
app.auth.bootstrap-superadmin-email=${AUTH_BOOTSTRAP_SUPERADMIN_EMAIL:}
app.auth.bootstrap-superadmin-password=${AUTH_BOOTSTRAP_SUPERADMIN_PASSWORD:}
app.auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
