spring.application.name=Quant_Strategy
server.port=8080
server.forward-headers-strategy=framework
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operationsSorter=alpha

spring.profiles.active=dev
# Server Configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
stock-price.startup-update.enabled=false
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#Logging
spring.main.log-startup-info=false
logging.level.root=info
logging.level.org.springframework.web=info
logging.level.org.hibernate=error
logging.file.name=Quant_Strategy.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n

# LLM provider configuration. Keep real API keys in environment variables.
llm.ica.base-url=https://api.nextgen-beta.ica.ibm.com/ica/v1
llm.ica.api-key=${ICA_API_KEY:}
llm.openai.base-url=https://api.openai.com/v1
llm.openai.api-key=${OPENAI_API_KEY:}
llm.anthropic.base-url=https://api.anthropic.com/v1
llm.anthropic.api-key=${ANTHROPIC_API_KEY:}
llm.anthropic.api-version=${ANTHROPIC_API_VERSION:2023-06-01}
llm.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
llm.gemini.api-key=${GEMINI_API_KEY:}
